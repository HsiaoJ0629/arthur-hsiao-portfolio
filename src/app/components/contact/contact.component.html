<section id="contact" class="contact">
  <div class="page-wrap inner">
    <p class="eyebrow status"><span class="status-dot"></span>Available for new opportunities</p>
    <h2 class="display title">Have a role or a project in mind? Let’s talk.</h2>

    <div class="links">
      <a class="link light" [href]="mailto">
        <span class="label">Email</span>
        <span class="value">{{ email }}</span>
      </a>
      <a class="link ghost" [href]="linkedInUrl" target="_blank" rel="noopener">
        <span class="label">LinkedIn</span>
        <span class="value">Connect with me</span>
      </a>
    </div>

    <footer class="foot">
      <span>© {{ year }} Arthur Hsiao</span>
      <span>Built with Angular 19 · SSR · Angular Material</span>
    </footer>
  </div>
</section>
