<aside class="panel" aria-labelledby="skills-heading">
  <div class="head">
    <h3 id="skills-heading">Skills</h3>
    @if (selectedSkill) {
      <button type="button" class="clear" (click)="clear()">Clear</button>
    }
  </div>
  <p class="status" aria-live="polite">
    @if (selectedSkill) {
      Showing where I’ve used {{ selectedSkill }}.
    } @else {
      Pick a skill to see where I’ve used it.
    }
  </p>

  @for (group of skills; track group.category) {
    <div class="group">
      <h4 class="cat">{{ group.category }}</h4>
      <div class="chips">
        @for (item of group.items; track item) {
          <button
            type="button"
            class="chip"
            [class.on]="item === selectedSkill"
            [attr.aria-pressed]="item === selectedSkill"
            (click)="onSelectSkill(item)">
            {{ item }}
          </button>
        }
      </div>
    </div>
  }
</aside>
